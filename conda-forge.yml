build_platform: {osx_arm64: osx_64, linux_aarch64: linux_aarch64}
conda_forge_output_validation: true
provider: {linux_aarch64: github, linux_ppc64le: azure, win: azure}
github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  error_overlinking: true
  pkg_format: '2'
conda_build_tool: rattler-build
conda_install_tool: pixi
test: native_and_emulated
